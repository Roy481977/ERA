<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ERA — the Living Town</title>
<style>
  :root { --ink:#2b2b33; --panel:#f4f1ea; --line:#d8d2c4; --accent:#3d6b4f; }
  html,body { margin:0; height:100%; overflow:hidden; background:#8fa17b;
              font:13px/1.45 "Avenir Next","Segoe UI",sans-serif; color:var(--ink); }
  #cv { position:absolute; inset:0; cursor:grab; }
  #cv.drag { cursor:grabbing; }
  .panel { position:absolute; background:var(--panel); border:1px solid var(--line);
           border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  #topbar { top:10px; left:50%; transform:translateX(-50%); padding:7px 14px;
            display:flex; gap:10px; align-items:center; white-space:nowrap; z-index:5; }
  #clockbox { min-width:210px; font-weight:600; }
  #wxbox { min-width:52px; text-align:center; }
  button { background:#fff; border:1px solid var(--line); border-radius:7px;
           padding:3px 9px; font:inherit; cursor:pointer; color:var(--ink); }
  button:hover { border-color:#9a9484; }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #scrubrow { top:56px; left:50%; transform:translateX(-50%); padding:5px 14px;
              display:flex; gap:8px; align-items:center; z-index:5; }
  #scrub { width:340px; }
  #filters { left:10px; top:10px; padding:8px 10px; z-index:5; max-width:150px; }
  #filters .chip { display:block; width:100%; margin:2px 0; text-align:left; }
  #info { right:10px; top:10px; width:270px; max-height:70vh; overflow:auto;
          padding:12px 14px; z-index:5; display:none; }
  #info h3 { margin:0 0 2px; font-size:15px; }
  #info .sub { color:#6d675b; margin-bottom:6px; }
  #info .sec { margin-top:8px; font-weight:600; color:#4a4438; }
  #info ul { margin:2px 0 0; padding-left:16px; }
  #info li { margin:1px 0; }
  #feed { left:10px; bottom:10px; width:335px; max-height:32vh; overflow:auto;
          padding:8px 12px; z-index:5; }
  #feed .it { padding:1.5px 0; border-bottom:1px dotted #e3ddcf; }
  #feed .tm { color:#8a8172; font-variant-numeric:tabular-nums; margin-right:6px; }
  #feed .goal { color:#7a2f22; font-weight:600; }
  #hint { position:absolute; right:12px; bottom:10px; color:#f4f1ea;
          text-shadow:0 1px 2px rgba(0,0,0,.4); z-index:4; font-size:12px; }
  .close { float:right; border:none; background:none; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="panel" id="topbar">
  <span id="clockbox">—</span><span id="wxbox">—</span>
  <button id="bPause">❚❚</button>
  <button id="b1" class="on">1×</button><button id="b2">2×</button>
  <button id="b5">5×</button><button id="b20">20×</button>
  <span style="color:#b7b0a0">|</span>
  <button id="bMorn">tomorrow&nbsp;07:00</button>
  <button id="bSat">next&nbsp;Saturday</button>
  <button id="bWeek">+1&nbsp;week</button>
</div>
<div class="panel" id="scrubrow">
  <button id="bBack1h">−1h</button><button id="bYest">yesterday</button>
  <button id="bLastSat">last&nbsp;Sat</button>
  <input type="range" id="scrub" min="0" max="1" value="0">
</div>
<div class="panel" id="filters">
  <b>see</b>
  <button class="chip on" data-f="all">everyone</button>
  <button class="chip" data-f="sup">supporters</button>
  <button class="chip" data-f="child">children</button>
  <button class="chip" data-f="hh">households</button>
  <button class="chip" data-f="new">newcomers</button>
  <button class="chip" data-f="move">on the move</button>
  <button class="chip" data-f="friends">friends of…</button>
</div>
<div class="panel" id="info"></div>
<div class="panel" id="feed"><b>the town today</b><div id="feeditems"></div></div>
<div id="hint">drag to pan · wheel to zoom · click a person or a place</div>

<script>
const D = /*__DATA__*/null;
const SLOTS=[420,540,660,780,900,1020,1140], SLEN=120, DAYMIN=1440;
const NDAYS=D.meta.weeks*7, DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const P=D.places, PIDS=D.placeIds, R=D.residents;
const codeLoc={}; PIDS.forEach((pid,i)=>codeLoc[String.fromCharCode(65+i)]=pid);
function hash(s){let x=7;for(const c of s)x=(x*31+c.charCodeAt(0))>>>0;return x;}
function dateStr(day){const ms=D.cal.mstart;let mi=0;
  for(let i=ms.length-1;i>=0;i--){if(day>=ms[i]){mi=i;break;}}
  return DOW[day%7]+" "+(day-ms[mi]+1)+" "+D.cal.mname[mi];}
function hm(min){const h=Math.floor(min/60),m=Math.floor(min%60);
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");}
function wxAt(day){return {r:"rain",w:"wind",d:"dry"}[D.wx[day]];}
const isSchoolHol=day=>D.cal.breaks.some(b=>day>=b[0]&&day<=b[1]);

// ------------------------------------------------ resident geometry
function locOf(code,r){
  if(code==="~")return null;
  if(code===".")return D.plotLoc[r.home];
  const pid=codeLoc[code]; return [P[pid].x,P[pid].y];
}
function scatter(name,pid){const hx=hash(name+pid);
  const a=(hx%360)*Math.PI/180, rr=0.8+((hx>>4)%20)/9;
  return [Math.cos(a)*rr,Math.sin(a)*rr];}
function slotOf(tod){ if(tod<SLOTS[0])return -1;
  const s=Math.floor((tod-SLOTS[0])/SLEN); return s>6?7:s;}
function codeAt(ri,day,s){
  const r=R[ri]; if(day<r.arr)return "~";
  if(s<0||s>6)return ".";
  return D.pos[r.n][day][s];}
function posAt(ri,minAbs){
  const day=Math.floor(minAbs/DAYMIN), tod=minAbs%DAYMIN, r=R[ri];
  if(day>=NDAYS)return null;
  const s=slotOf(tod);
  const cur=codeAt(ri,day,s), prev=codeAt(ri,day,s-1);
  if(cur==="~")return null;
  const cl=locOf(cur,r), pl=locOf(prev==="~"?".":prev,r);
  const key=cur==="."?"h":codeLoc[cur];
  const off=scatter(r.n,key), tgt=[cl[0]+off[0],cl[1]+off[1]];
  if(s<0||s>6||cur===prev)return {x:tgt[0],y:tgt[1],walk:false,code:cur};
  const into=tod-(SLOTS[Math.min(s,6)]||SLOTS[0]);
  const d=Math.hypot(cl[0]-pl[0],cl[1]-pl[1]);
  const dur=Math.max(8,Math.min(48,d*0.55));
  if(into>=dur)return {x:tgt[0],y:tgt[1],walk:false,code:cur};
  const t=into/dur, po=scatter(r.n,prev==="."?"h":codeLoc[prev]);
  const sx=pl[0]+po[0], sy=pl[1]+po[1];
  const mx=(sx+tgt[0])/2+Math.sin(hash(r.n)%7+t*3)*0.6;
  return {x:sx+(tgt[0]-sx)*t, y:sy+(tgt[1]-sy)*t+Math.sin(t*Math.PI)*(mx-sx)*0.04,
          walk:true, code:cur};
}

// ------------------------------------------------ recognition (derived, replayable)
let rec={}, recDay=-1;
function rebuildRec(uptoDay){
  rec={}; R.forEach(r=>rec[r.n]={});
  for(let day=0; day<=Math.min(uptoDay,NDAYS-1); day++){
    const met={};
    for(let s=0;s<7;s++){
      const g={};
      for(let i=0;i<R.length;i++){const c=codeAt(i,day,s);
        if(c!=="."&&c!=="~"){(g[c]=g[c]||[]).push(R[i].n);}}
      for(const c in g){const ns=g[c];
        for(let a=0;a<ns.length;a++)for(let b=a+1;b<ns.length;b++){
          const k=ns[a]+"|"+ns[b];
          if(!met[k]){met[k]=1;
            rec[ns[a]][ns[b]]=(rec[ns[a]][ns[b]]||0)+1;
            rec[ns[b]][ns[a]]=(rec[ns[b]][ns[a]]||0)+1;}}}
    }
  }
  recDay=uptoDay;
}

// ------------------------------------------------ time engine
let simMin=6*60+40, speed=1, paused=false;
const SPEED_MIN_PER_SEC=12;                 // 1× — a slot in ~10s, a day in ~2min
function advance(dtSec){
  if(paused)return;
  let mult=speed;
  const tod=simMin%DAYMIN;
  if(tod>21.7*60||tod<6.6*60)mult=Math.max(mult,40);   // the night passes quickly
  simMin=Math.min(simMin+dtSec*SPEED_MIN_PER_SEC*mult, NDAYS*DAYMIN-1);
}
function jumpTo(m){ simMin=Math.max(0,Math.min(m,NDAYS*DAYMIN-1));
  feedDay=-1; const d=Math.floor(simMin/DAYMIN);
  if(d!==recDay)rebuildRec(d); }

// ------------------------------------------------ timeline feed
let feedDay=-1, feedItems=[], feedShown=0;
function countAt(pid,day,s){
  const c=String.fromCharCode(65+PIDS.indexOf(pid));let n=0;
  for(const nm in D.pos){if(D.pos[nm][day][s]===c)n++;}return n;}
function buildFeed(day){
  const f=[]; const wx=D.wx[day];
  if(wx==="r")f.push([415,"rain sets in over the town"]);
  if(wx==="w")f.push([415,"a windy one"]);
  if(day%7<5&&!isSchoolHol(day)&&day>=0)f.push([545,"children arrive at school"]);
  // place-life lines, computed from the record itself
  PIDS.forEach(pid=>{const pl=P[pid];if(!pl.pub_)return;
    if(pl.caps.includes("bread")&&countAt(pid,day,0)>=8)
      f.push([445,"the "+pid+" fills with the morning"]);
    if(pl.caps.includes("drink")&&countAt(pid,day,5)>=20)
      f.push([1025,"the "+pid+" fills"+(day%7===5?" after the match":"")]);});
  const w=Math.floor(day/7), fx=D.fixtures[w];
  if(fx&&day%7===5){
    if(fx.venue==="home"){
      f.push([755,"supporters begin drifting toward the ground"]);
      f.push([785,"kick-off: "+D.meta.club+" v "+fx.opp]);
      fx.goals.forEach(g=>f.push([785+Math.round(g*0.93),
        "GOAL — "+D.meta.club+" score ("+g+"')","goal"]));
      f.push([875,"full time: "+D.meta.club+" "+fx.gf+"–"+fx.ga+" "+fx.opp,
              fx.result==="win"?"goal":""]);
      f.push([885,"the ground empties into the streets"]);
    } else {
      f.push([1000,"word comes back from "+fx.opp+": "+
              (fx.result==="win"?"won":fx.result==="draw"?"drew":"lost")+
              " "+fx.gf+"–"+fx.ga]);
    }
  }
  const KM={argue:675,peace:620,borrow:605,bday:510,ticket:860,arrive:580,retire:1050,join:730};
  D.events.forEach(e=>{if(e.d===day)f.push([KM[e.k]||700,e.t,e.k==="argue"?"goal":""]);});
  {const today=D.recog.filter(e=>e.d===day);
   today.slice(0,3).forEach((e,i)=>
     f.push([498+i*7,e.a+" starts greeting "+e.b+" by name"]));
   if(today.length>3)
     f.push([519,today[0].a+" is starting to know faces — "+(today.length-3)+" more this week"]);}
  if(D.cal.holidays.includes(day))f.push([420,"public holiday — the shops stay shut"]);
  f.sort((a,b)=>a[0]-b[0]);
  return f;
}
function updateFeed(){
  const day=Math.floor(simMin/DAYMIN), tod=simMin%DAYMIN;
  if(day!==feedDay){feedDay=day;feedItems=buildFeed(day);feedShown=0;
    document.getElementById("feeditems").innerHTML=
      "<div class='it' style='color:#8a8172'>— "+dateStr(day)+" —</div>";}
  const box=document.getElementById("feeditems");
  while(feedShown<feedItems.length&&feedItems[feedShown][0]<=tod){
    const [tm,tx,cls]=feedItems[feedShown++];
    const div=document.createElement("div");
    div.className="it"+(cls?" "+cls:"");
    div.innerHTML="<span class='tm'>"+hm(tm)+"</span>"+tx;
    box.appendChild(div);
    box.parentElement.scrollTop=box.parentElement.scrollHeight;
    if(box.children.length>90)box.removeChild(box.children[1]);
  }
}

// ------------------------------------------------ camera + canvas
const cv=document.getElementById("cv"), cx=cv.getContext("2d");
let cam={x:86,y:24,z:6};
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
  cam.z=Math.min(innerWidth/230,innerHeight/135)*devicePixelRatio;}
addEventListener("resize",resize);resize();
cam.z*=1; // fit
function W2S(x,y){return [(x-cam.x)*cam.z+cv.width/2,(cam.y-y)*cam.z+cv.height/2];}
function S2W(px,py){return [(px*devicePixelRatio-cv.width/2)/cam.z+cam.x,
                            cam.y-(py*devicePixelRatio-cv.height/2)/cam.z];}
let dragging=false,lastP=null;
cv.addEventListener("mousedown",e=>{dragging=true;lastP=[e.clientX,e.clientY];cv.classList.add("drag");});
addEventListener("mouseup",()=>{dragging=false;cv.classList.remove("drag");});
addEventListener("mousemove",e=>{if(!dragging)return;
  cam.x-=(e.clientX-lastP[0])*devicePixelRatio/cam.z;
  cam.y+=(e.clientY-lastP[1])*devicePixelRatio/cam.z;
  lastP=[e.clientX,e.clientY];});
cv.addEventListener("wheel",e=>{e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0012);
  const [wx,wy]=S2W(e.clientX,e.clientY);
  cam.z*=f; cam.x=wx-(wx-cam.x)/f; cam.y=wy-(wy-cam.y)/f;},{passive:false});

// ------------------------------------------------ drawing
function rrect(x,y,w,h,r){cx.beginPath();cx.roundRect(x,y,w,h,r);}
function drawMap(day,tod){
  const L=D.level, z=cam.z;
  // terrain
  cx.fillStyle="#98a883";cx.fillRect(0,0,cv.width,cv.height);
  const ter=(rect,fill)=>{const[a,b,c,d]=rect;const[x0,y0]=W2S(a,d),[x1,y1]=W2S(c,b);
    cx.fillStyle=fill;cx.fillRect(x0,y0,x1-x0,y1-y0);};
  ter(L.terrain.playing_field,"#8fae72");
  ter(L.terrain.allotments,"#9a9469");
  ter(L.terrain.ground_apron,"#93a08a");
  // allotment rows
  cx.strokeStyle="rgba(90,85,50,.35)";cx.lineWidth=Math.max(1,z*0.25);
  for(let yy=60;yy<80;yy+=3){const[ax,ay]=W2S(4,yy),[bx,by]=W2S(76,yy);
    cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(bx,by);cx.stroke();}
  // water
  cx.strokeStyle="#7d99a8";cx.lineWidth=L.water.w*z;cx.lineJoin="round";cx.beginPath();
  L.water.pts.forEach((p,i)=>{const[sx,sy]=W2S(p[0],p[1]);i?cx.lineTo(sx,sy):cx.moveTo(sx,sy);});
  cx.stroke();
  // roads
  cx.fillStyle="#b8b2a4";
  L.roads.forEach(r=>{const[x0,y0]=W2S(r[0],r[3]),[x1,y1]=W2S(r[2],r[1]);
    cx.fillRect(x0,y0,x1-x0,y1-y0);});
  // paths
  L.paths.forEach(p=>{
    const col=p.k==="worn"?"rgba(160,140,100,.55)":"rgba(205,198,180,.85)";
    if(p.r){const r=p.r;const[x0,y0]=W2S(r[0],r[3]),[x1,y1]=W2S(r[2],r[1]);
      cx.fillStyle=col;
      cx.fillRect(x0,y0,Math.max(x1-x0,z*0.6),Math.max(y1-y0,z*0.6));}
    else{cx.strokeStyle=col;cx.lineWidth=z*0.8;cx.beginPath();
      p.pts.forEach((q,i)=>{const[sx,sy]=W2S(q[0],q[1]);
        i?cx.lineTo(sx,sy):cx.moveTo(sx,sy);});cx.stroke();}});
  // bridge
  {const[bx,by]=W2S(L.bridge[0],L.bridge[1]);
   cx.fillStyle="#a9a294";cx.fillRect(bx-3*z,by-1.2*z,6*z,2.4*z);}
  // pitch + stand + floodlights
  {const[gx,gy]=W2S(146,72),[gx2,gy2]=W2S(176,52);
   cx.fillStyle="#7fa864";cx.fillRect(gx,gy,gx2-gx,gy2-gy);
   cx.strokeStyle="rgba(255,255,255,.55)";cx.lineWidth=Math.max(1,z*.14);
   cx.strokeRect(gx,gy,gx2-gx,gy2-gy);
   const s=L.stand;const[sx,sy]=W2S(s[0],s[1]);
   cx.fillStyle="#6b6257";cx.fillRect(sx,sy-s[3]*z,s[2]*z,s[3]*z);
   L.floodlights.forEach(f=>{const[fx2,fy2]=W2S(f[0],f[1]);
     cx.strokeStyle="#5a544a";cx.lineWidth=Math.max(1,z*.2);
     cx.beginPath();cx.moveTo(fx2,fy2);cx.lineTo(fx2,fy2-3.5*z);cx.stroke();
     cx.fillStyle=(tod>1020||wxAt(day)!=="dry")&&isMatchHome(day)?"#ffe9a8":"#8d867a";
     cx.fillRect(fx2-1.1*z,fy2-4.4*z,2.2*z,1.0*z);});}
  // market stalls (Fridays, open hours)
  if(day%7===4&&tod>500&&tod<870){cx.fillStyle="#b06a4a";
    for(let i=0;i<5;i++){const[mx,my]=W2S(110+i*3.4,20);
      cx.fillRect(mx,my,2.4*z,1.6*z);}}
  // plots (houses)
  L.plots.forEach(p=>{const[px,py]=W2S(p.x,p.y);
    cx.fillStyle="#c9beab";rrect(px-2.6*z,py-2.0*z,5.2*z,4.0*z,z*0.5);cx.fill();
    cx.fillStyle="#8d7f6d";cx.fillRect(px-2.6*z,py-2.0*z,5.2*z,1.1*z);});
  // shops row: emphasize public buildings by their place dots
  PIDS.forEach(pid=>{const pl=P[pid];
    if(pl.x==null||!pl.pub_)return;const[sx,sy]=W2S(pl.x,pl.y);
    // occupancy halo
    const n=occNow[pid]||0;
    if(n>0){cx.fillStyle="rgba(240,220,140,"+Math.min(.5,.12+n*.04)+")";
      cx.beginPath();cx.arc(sx,sy,(2.4+Math.sqrt(n)*1.5)*z,0,7);cx.fill();}
    cx.fillStyle="#7a7264";cx.beginPath();cx.arc(sx,sy,z*.7,0,7);cx.fill();
    if(cam.z>7*devicePixelRatio){cx.fillStyle="#3d382f";
      cx.font=(3.2*z/devicePixelRatio*devicePixelRatio*0.32|0)+"px sans-serif";
      cx.textAlign="center";cx.fillText(pid,sx,sy-z*1.4);}});
  // the oak
  {const[ox,oy]=W2S(L.oak[0],L.oak[1]);
   cx.fillStyle="#55703f";cx.beginPath();cx.arc(ox,oy,2.8*z,0,7);cx.fill();
   cx.fillStyle="#476034";cx.beginPath();cx.arc(ox-z,oy-z*.7,1.8*z,0,7);cx.fill();}
  // trees
  L.veg.forEach(v=>{const[vx,vy]=W2S(v[0],v[1]);
    cx.fillStyle="#5d7847";cx.beginPath();cx.arc(vx,vy,(v[2]?1.4:0.8)*z,0,7);cx.fill();});
}
function isMatchHome(day){const w=Math.floor(day/7),fx=D.fixtures[w];
  return !!(fx&&fx.venue==="home"&&day%7===5);}

// filters
let filter="all", selRes=null, selPlace=null;
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
  b.classList.add("on");filter=b.dataset.f;});
function passFilter(i,pos){
  const r=R[i];
  switch(filter){
    case "sup":return r.sup;
    case "child":return r.child;
    case "new":return r.arr>0;
    case "move":return pos.walk;
    case "friends":return selRes!=null&&(rec[R[selRes].n][r.n]||0)>=7;
    default:return true;}
}
const hhColor={},resColor=[];
R.forEach((r,i)=>{if(!hhColor[r.hh])hhColor[r.hh]="hsl("+(hash(r.hh)%360)+",42%,38%)";
  resColor[i]="hsl("+(hash(r.n)%360)+",35%,33%)";});

let occNow={};
function drawResidents(){
  occNow={};
  const day=Math.floor(simMin/DAYMIN);
  resPos=[];
  for(let i=0;i<R.length;i++){
    const p=posAt(i,simMin);resPos.push(p);
    if(!p)continue;
    if(p.code!=="."&&p.code!=="~"&&!p.walk){const pid=codeLoc[p.code];
      occNow[pid]=(occNow[pid]||0)+1;}
  }
  for(let i=0;i<R.length;i++){
    const p=resPos[i];if(!p)continue;
    const pass=passFilter(i,p);
    const[sx,sy]=W2S(p.x,p.y);
    const rr=(R[i].child?0.75:1.0)*Math.max(2.4,cam.z*0.55);
    cx.globalAlpha=pass?1:0.16;
    cx.fillStyle=filter==="hh"?hhColor[R[i].hh]:resColor[i];
    cx.beginPath();cx.arc(sx,sy,rr,0,7);cx.fill();
    if(R[i].sup&&isMatchHome(day)){cx.strokeStyle="#e8e2d2";
      cx.lineWidth=1.2*devicePixelRatio;cx.stroke();}
    if(selRes===i){cx.strokeStyle="#fff";cx.lineWidth=2*devicePixelRatio;
      cx.beginPath();cx.arc(sx,sy,rr+3,0,7);cx.stroke();}
    cx.globalAlpha=1;
  }
}
let resPos=[];

// day/night + weather wash
function drawWash(day,tod){
  const wx=D.wx[day];
  if(wx==="r"){cx.fillStyle="rgba(70,90,120,.14)";cx.fillRect(0,0,cv.width,cv.height);}
  let dark=0;
  if(tod<400)dark=.55;else if(tod<440)dark=.55*(440-tod)/40;
  else if(tod>1290)dark=.55;else if(tod>1230)dark=.55*(tod-1230)/60;
  if(dark>0){cx.fillStyle="rgba(20,26,48,"+dark+")";cx.fillRect(0,0,cv.width,cv.height);}
}

// ------------------------------------------------ click + panels
cv.addEventListener("click",e=>{
  const px=e.clientX*devicePixelRatio,py=e.clientY*devicePixelRatio;
  let best=-1,bd=12*devicePixelRatio;
  for(let i=0;i<R.length;i++){const p=resPos[i];if(!p)continue;
    const[sx,sy]=W2S(p.x,p.y);const d=Math.hypot(sx-px,sy-py);
    if(d<bd){bd=d;best=i;}}
  if(best>=0){selRes=best;selPlace=null;renderInfo();return;}
  let bp=null,bpd=16*devicePixelRatio;
  PIDS.forEach(pid=>{const pl=P[pid];if(pl.x==null||!pl.pub_)return;
    const[sx,sy]=W2S(pl.x,pl.y);const d=Math.hypot(sx-px,sy-py);
    if(d<bpd){bpd=d;bp=pid;}});
  if(bp){selPlace=bp;selRes=null;renderInfo();return;}
  selRes=null;selPlace=null;document.getElementById("info").style.display="none";
});
function locPhrase(p,r){
  if(!p)return "not yet in town";
  if(p.code===".")return "at home";
  const pid=codeLoc[p.code];
  return (p.walk?"walking to the ":"at the ")+pid;
}
function moodOf(i,day){
  const r=R[i];
  const argued=D.events.some(e=>e.k==="argue"&&e.d>day-6&&e.d<=day&&e.t.includes(r.n));
  if(argued)return "prickly";
  const w=Math.floor(day/7),fx=D.fixtures[w];
  if(r.sup&&fx&&fx.result==="win"&&day%7>=5)return "cheerful";
  if(D.wx[day]==="r")return "a little grey";
  return "content";
}
function renderInfo(){
  const box=document.getElementById("info");box.style.display="block";
  const day=Math.floor(simMin/DAYMIN),tod=simMin%DAYMIN;
  if(recDay!==day)rebuildRec(day);
  if(selRes!=null){
    const i=selRes,r=R[i],p=resPos[i];
    const rels=Object.entries(rec[r.n]||{}).filter(([o,c])=>c>=7)
      .sort((a,b)=>b[1]-a[1]).slice(0,5).map(([o])=>o);
    const open=D.intents.filter(t=>t.n===r.n&&t.b<=day&&t.e>day&&t.st!=="forgot");
    let today="";
    for(let s=0;s<7;s++){const c=codeAt(i,day,s);
      if(SLOTS[s]>tod)break;
      if(c!=="."&&c!=="~")today+="<li>"+hm(SLOTS[s]+8+hash(r.n+s)%22)+" — the "+codeLoc[c]+"</li>";}
    let wk={m:0,a:0};
    for(let dd2=Math.max(0,day-6);dd2<=day;dd2++)for(let s=0;s<7;s++){
      const c=codeAt(i,dd2,s);if(c==="~"||c===".")continue;
      if(codeLoc[c]==="ground")wk.m=1;if(codeLoc[c]==="allotment")wk.a++;}
    box.innerHTML="<button class='close' onclick=\"this.parentElement.style.display='none'\">×</button>"
      +"<h3>"+r.n+"</h3><div class='sub'>age "+r.age+(r.child?" · at school":" · "+r.occ)+"</div>"
      +"<div class='sec'>now</div>"+locPhrase(p,r)
      +"<div class='sec'>mood</div>"+moodOf(i,day)
      +(open.length?"<div class='sec'>meaning to</div><ul>"+open.map(t=>"<li>"
        +t.kind+" — "+(t.note||t.tg)+"</li>").join("")+"</ul>":"")
      +"<div class='sec'>knows well</div>"+(rels.join(", ")||"nobody yet")
      +"<div class='sec'>today</div><ul>"+(today||"<li>home so far</li>")+"</ul>"
      +"<div class='sec'>this week</div><ul>"
      +(wk.m?"<li>went to the match</li>":"")
      +(wk.a?"<li>allotment ×"+wk.a+"</li>":"")
      +((!wk.m&&!wk.a)?"<li>a quiet week</li>":"")+"</ul>";
  } else if(selPlace){
    const pid=selPlace,pl=P[pid],stt=D.pstats[pid]||{};
    const openNow=(pl.days==null||pl.days.includes(day%7))
      &&pl.open.includes(Math.max(0,Math.min(6,slotOf(tod))))
      &&!(pl.match_only&&!isMatchHome(day));
    const there=[];
    R.forEach((r,i)=>{const p=resPos[i];
      if(p&&!p.walk&&p.code!=="."&&codeLoc[p.code]===pid)there.push(r.n);});
    box.innerHTML="<button class='close' onclick=\"this.parentElement.style.display='none'\">×</button>"
      +"<h3>the "+pid+"</h3><div class='sub'>"+(openNow?"open":"closed")+" · "
      +pl.caps.join(", ")+"</div>"
      +"<div class='sec'>right now</div>"+(there.length?there.length+" here — "
        +there.slice(0,8).join(", "):"empty")
      +(stt.tags&&stt.tags.length?"<div class='sec'>known for</div><ul>"
        +stt.tags.map(t=>"<li>"+t+"</li>").join("")+"</ul>":"")
      +"<div class='sec'>this year</div><ul><li>"+(stt.visits||0)+" visits</li>"
      +"<li>"+(stt.met||0)+" first meetings</li>"
      +(stt.args?"<li>"+stt.args+" arguments</li>":"")
      +(stt.peace?"<li>"+stt.peace+" reconciliations</li>":"")+"</ul>"
      +"<div class='sec'>regulars</div>"+((stt.regulars||[]).join(", ")||"—");
  }
}

// ------------------------------------------------ controls
const $=id=>document.getElementById(id);
function setSpeed(s,btn){speed=s;paused=false;
  ["b1","b2","b5","b20"].forEach(b=>$(b).classList.remove("on"));
  $("bPause").classList.remove("on");if(btn)$(btn).classList.add("on");}
$("bPause").onclick=()=>{paused=!paused;$("bPause").classList.toggle("on",paused);};
$("b1").onclick=()=>setSpeed(1,"b1");$("b2").onclick=()=>setSpeed(2,"b2");
$("b5").onclick=()=>setSpeed(5,"b5");$("b20").onclick=()=>setSpeed(20,"b20");
$("bMorn").onclick=()=>jumpTo((Math.floor(simMin/DAYMIN)+1)*DAYMIN+7*60);
$("bSat").onclick=()=>{let d=Math.floor(simMin/DAYMIN)+1;while(d%7!==5)d++;
  jumpTo(d*DAYMIN+12.8*60);};
$("bWeek").onclick=()=>jumpTo(simMin+7*DAYMIN);
$("bBack1h").onclick=()=>jumpTo(simMin-60);
$("bYest").onclick=()=>jumpTo(simMin-DAYMIN);
$("bLastSat").onclick=()=>{let d=Math.floor(simMin/DAYMIN)-1;while(d>=0&&d%7!==5)d--;
  if(d>=0)jumpTo(d*DAYMIN+12.8*60);};
const scrub=$("scrub");scrub.max=NDAYS*DAYMIN-1;
scrub.addEventListener("input",()=>jumpTo(+scrub.value));

// ------------------------------------------------ main loop
rebuildRec(0);
let lastT=performance.now();
function frame(t){
  const dt=Math.min(0.1,(t-lastT)/1000);lastT=t;
  advance(dt);
  const day=Math.floor(simMin/DAYMIN),tod=simMin%DAYMIN;
  if(day!==recDay)rebuildRec(day);
  drawMap(day,tod);
  drawResidents();
  drawWash(day,tod);
  updateFeed();
  $("clockbox").textContent=dateStr(day)+"  ·  "+hm(tod)
    +(isMatchHome(day)?"  ⚽ home match":"");
  $("wxbox").textContent={r:"🌧",w:"🌬",d:"☀️"}[D.wx[day]];
  if(!scrubHeld)scrub.value=simMin;
  if(selRes!=null||selPlace)if((t|0)%20<17)renderInfo();
  requestAnimationFrame(frame);
}
let scrubHeld=false;
scrub.addEventListener("pointerdown",()=>scrubHeld=true);
addEventListener("pointerup",()=>scrubHeld=false);
requestAnimationFrame(frame);
</script>
