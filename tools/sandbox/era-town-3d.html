<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ERA — District 01, the first 3D town</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#20242e;
    font:13px/1.4 "Avenir Next","Segoe UI",sans-serif;color:#2b2b33;}
  #hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    background:#f4f1eaee;border:1px solid #d8d2c4;border-radius:10px;
    padding:6px 12px;display:flex;gap:8px;align-items:center;z-index:5;white-space:nowrap;}
  #cams{position:absolute;left:10px;top:10px;background:#f4f1eaee;
    border:1px solid #d8d2c4;border-radius:10px;padding:8px;z-index:5;}
  #cams button{display:block;width:100%;margin:2px 0;text-align:left;}
  button{background:#fff;border:1px solid #d8d2c4;border-radius:7px;
    padding:3px 8px;font:inherit;cursor:pointer;}
  button.on{background:#3d6b4f;color:#fff;border-color:#3d6b4f;}
  #clock{font-weight:600;min-width:215px;}
  #hint{position:absolute;right:12px;bottom:10px;color:#e8e2d2;z-index:4;font-size:12px;
    text-shadow:0 1px 2px #0008;}
</style>
</head>
<body>
<div id="hud">
  <span id="clock">—</span><span id="wx">—</span>
  <button id="bPause">❚❚</button>
  <button id="b1" class="on">1×</button><button id="b5">5×</button>
  <button id="b60">60×</button>
  <span style="color:#b7b0a0">|</span>
  <button id="bMorn">07:00</button><button id="bSat">next Sat</button>
</div>
<div id="cams"><b>camera</b>
  <button data-c="canon" class="on">three-quarter</button>
  <button data-c="market">Market Street</button>
  <button data-c="green">green &amp; oak</button>
  <button data-c="bridge">Bridge Road</button>
  <button data-c="ground">from the ground</button>
  <button data-c="eye">eye level</button>
  <button data-c="follow">follow Bill</button>
</div>
<div id="hint">drag to orbit · wheel to zoom · right-drag to pan</div>

function lighting(day,tod){
  const wx=D.wx[day];
  const dayT=Math.max(0,Math.min(1,(tod-380)/60))*Math.max(0,Math.min(1,(1310-tod)/70));
  // the sun genuinely travels: low and golden at the shoulders, high at one
  const prog=Math.max(0,Math.min(1,(tod-400)/(1290-400)));
  const az=Math.PI*(0.08+prog*0.84);
  const el=0.12+Math.sin(prog*Math.PI)*0.78;          // radians of elevation
  const rS=260;
  sun.position.set(86-Math.cos(az)*rS*Math.cos(el),
    Math.sin(el)*rS*0.6+6,-24+Math.sin(az)*rS*Math.cos(el)*0.4+70);
  sun.target.position.set(86,0,-24);
  const golden=Math.pow(1-Math.sin(prog*Math.PI),1.5);  // 1 at shoulders
  sun.color.setHex(golden>0.55?0xffc27a:(golden>0.25?0xffdfae:0xfff3e0));
  sun.intensity=(wx==="r"?0.22:wx==="w"?0.75:1.25)*dayT*(0.75+0.25*(1-golden));
  amb.intensity=0.05+0.37*dayT*(wx==="r"?0.72:1);
  amb.color.setHex(dayT>0.25?0xffffff:0x8fa2c8);
  hemi.intensity=0.06+0.42*dayT;
  hemi.color.setHex(wx==="r"?0x9aa8b4:(dayT>0.25?0xbcd4e4:0x2a3450));
  hemi.groundColor.setHex(0x77704e);
  // sky by hour
  const nightAmt=1-dayT;
  if(wx==="r")paintSky("#7e8c99","#a8b2ba","#c2beb0");
  else if(golden>0.42&&dayT>0.05)paintSky("#7d9cc0","#e8c9a0","#f2b678");
  else paintSky("#82aecc","#c8dde8","#ecdfc2");
  if(nightAmt>0.6)paintSky("#0e1424","#1c2438","#2c3048");
  scene.fog.color.setHex(wx==="r"?0xa8b2ba:(nightAmt>0.6?0x1c2438:0xd8d4c0));
  scene.fog.near=wx==="r"?170:210;scene.fog.far=wx==="r"?520:640;
  const lampsOn=tod>1170||tod<430;
  lampLights.forEach(l=>l.intensity=lampsOn?2.3:0);
  const matchLit=isMatchHome(day)&&tod>740&&tod<920;
  lamps.forEach(l=>{const fl=l.userData.flood;
    l.material.color.set(fl?(matchLit?0xffeeb0:0x8d867a)
                           :(lampsOn?0xffdf9a:0x9a948a));});
  const evening=tod>1020&&tod<1320;
  const occ={};AG.forEach(a2=>{if(a2.mode==="at"&&a2.place)occ[a2.place]=(occ[a2.place]||0)+1;});
  winMats.forEach(w2=>{
    const lit=w2.shop?(occ[w2.pid]>0):(evening||tod<410);
    w2.m.color.set(lit?PAL.GLSI:PAL.GLS);
    w2.m.emissive&&w2.m.emissive.set(lit?(nightAmt>0.6?0xc89a40:0x8a6a2c):0x000000);});
}

let camMode="canon",orbit={az:1.62,el:0.60,r:205,tx:92,tz:-26};
function applyCam(){
  if(camMode==="free")return;
  const day=Math.floor(simMin/DAYMIN);
  if(camMode==="follow"){const i=R.findIndex(r=>r.n==="Bill");
    const a=AG[i];const px=a.x,pz=-a.y;
    camera.position.set(px+16,13,pz+16);
    camera.lookAt(px,1,pz);return;}
  if(camMode==="eye"){camera.position.set(66,1.5,-16.4);
    camera.lookAt(108,1.6,-19.5);return;}
  if(camMode==="market"){camera.position.set(86,26,-52);camera.lookAt(88,0,-16);return;}
  if(camMode==="green"){camera.position.set(38,22,-56);camera.lookAt(51,0,-27);return;}
  if(camMode==="bridge"){camera.position.set(110,10,-14);camera.lookAt(152,4,-50);return;}
  if(camMode==="ground"){camera.position.set(168,16,-78);camera.lookAt(96,2,-16);return;}
  const {az,el,r,tx,tz}=orbit;
  camera.position.set(tx+Math.cos(el)*Math.cos(az)*r,
    Math.sin(el)*r,tz+Math.cos(el)*Math.sin(az)*r);
  camera.lookAt(tx,0,tz);}

function frame(t){const dt=Math.min(0.1,(t-lastT)/1000);lastT=t;
  advance(dt);

  if(day!==recDay)rebuildRec(day);

  const occNowP=pid=>{let n2=0;AG.forEach(a2=>{if(a2.mode==="at"&&a2.place===pid)n2++;});return n2;};
  for(let i=0;i<AG.length;i++){const a=AG[i],m=bodies[i];
    if(a.mode==="off"||a.mode==="home"){m.visible=false;continue;}
    m.visible=true;
    const walking=a.mode==="walk";
    const bob=walking?Math.abs(Math.sin(tod*22+i))*0.05:0;
    m.position.set(a.x,bob+bridgeH(a.x,a.y),-a.y);
    m.rotation.y=a.hd;
    m.rotation.z=walking?Math.sin(tod*22+i)*0.035:0;
    m.rotation.x=walking?0.06:0;
    m.userData.scarf.visible=homeMatch&&R[i].sup;}
  bunting.visible=homeMatch;

  laundry.forEach(L2=>{
    if(L2.g){const hangs=D.wx[day]!=="r"&&h01("wash"+day+L2.g.userData.plot)>0.42

    else{L2.m.rotation.y=Math.sin(tod*6+L2.ph*1.7)*0.22;}});
  {const baking=(occNowP("bakery")>0)&&tod<660;
   steam.forEach((sp,k)=>{sp.visible=baking;
     if(baking){const ph=(tod*3+k*0.8)%2.4;
       sp.position.y=4.4+ph*1.1;
       sp.position.x=P["bakery"].x+1.7+Math.sin(tod*2+k)*0.3;
       sp.material.opacity=0.78*(1-ph/2.4);}});}
  for(const pid in bikeProps){let has=false;
    AG.forEach((a,i)=>{if(a.mode==="at"&&a.place===pid&&R[i].bike)has=true;});
    bikeProps[pid].visible=has;}
  lighting(day,tod);applyCam();
  renderer.render(scene,camera);
  $("clock").textContent=dateStr(day)+" · "+hm(tod)
    +(isMatchHome(day)?" ⚽":"");
  $("wx").textContent={r:"🌧",w:"🌬",d:"☀️"}[D.wx[day]];
  requestAnimationFrame(frame);}
