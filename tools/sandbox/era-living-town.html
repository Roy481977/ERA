<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ERA — the Living Town</title>
<style>
  :root { --ink:#2b2b33; --panel:#f4f1ea; --line:#d8d2c4; --accent:#3d6b4f; }
  html,body { margin:0; height:100%; overflow:hidden; background:#8fa17b;
              font:13px/1.45 "Avenir Next","Segoe UI",sans-serif; color:var(--ink); }
  #cv { position:absolute; inset:0; cursor:grab; }
  #cv.drag { cursor:grabbing; }
  .panel { position:absolute; background:var(--panel); border:1px solid var(--line);
           border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  #topbar { top:10px; left:50%; transform:translateX(-50%); padding:7px 14px;
            display:flex; gap:10px; align-items:center; white-space:nowrap; z-index:5; }
  #clockbox { min-width:230px; font-weight:600; }
  button { background:#fff; border:1px solid var(--line); border-radius:7px;
           padding:3px 9px; font:inherit; cursor:pointer; color:var(--ink); }
  button:hover { border-color:#9a9484; }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #scrubrow { top:56px; left:50%; transform:translateX(-50%); padding:5px 14px;
              display:flex; gap:8px; align-items:center; z-index:5; }
  #scrub { width:320px; }
  #filters { left:10px; top:10px; padding:8px 10px; z-index:5; max-width:150px; }
  #filters .chip { display:block; width:100%; margin:2px 0; text-align:left; }
  #info { right:10px; top:10px; width:270px; max-height:70vh; overflow:auto;
          padding:12px 14px; z-index:5; display:none; }
  #info h3 { margin:0 0 2px; font-size:15px; }
  #info .sub { color:#6d675b; margin-bottom:6px; }
  #info .sec { margin-top:8px; font-weight:600; color:#4a4438; }
  #info ul { margin:2px 0 0; padding-left:16px; }
  #feed { left:10px; bottom:10px; width:335px; max-height:32vh; overflow:auto;
          padding:8px 12px; z-index:5; }
  #feed .it { padding:1.5px 0; border-bottom:1px dotted #e3ddcf; }
  #feed .tm { color:#8a8172; font-variant-numeric:tabular-nums; margin-right:6px; }
  #feed .goal { color:#7a2f22; font-weight:600; }
  #feed .enc { color:#3d6b4f; }
  #hint { position:absolute; right:12px; bottom:10px; color:#f4f1ea;
          text-shadow:0 1px 2px rgba(0,0,0,.4); z-index:4; font-size:12px; }
  .close { float:right; border:none; background:none; font-size:15px; cursor:pointer; }
</style>
</head>

        for(let a=0;a<ns.length;a++)for(let b=a+1;b<ns.length;b++){
          const k=ns[a]+"|"+ns[b];
          if(!met[k]){met[k]=1;
            rec[ns[a]][ns[b]]=(rec[ns[a]][ns[b]]||0)+1;
            rec[ns[b]][ns[a]]=(rec[ns[b]][ns[a]]||0)+1;}}}}}

const recOf=(a,b)=>(rec[a]&&rec[a][b])||0;

// ================================================= THE HUMAN LAYER
// continuous agents; goals from the record, behaviour every two seconds
const AG=R.map((r,i)=>({i,x:0,y:0,vx:0,vy:0,hd:0,mode:"home",trip:null,
  chat:0,chatWith:-1,pauseT:0,seat:-1,qpos:-1,partner:-1,cool:{},ann:{}}));
let curSlotKey=-1,forceSnap=false;
function nextCode(i,day,s){          // where the record says they'll be next
  if(s>=6)return ".";
  return codeAt(i,day,s+1);
}
function initSlot(day,s){
  curSlotKey=day*8+(s+1);
  // everyone stands at THIS slot's place (before dawn: at home); the walk
  // toward the NEXT slot is planned around ARRIVAL — punctual people
  // arrive early, dawdlers late
  AG.forEach((a,i)=>{const cur=s<0?(codeAt(i,day,0)==="~"?"~":"."):codeAt(i,day,s);
    if(cur==="~"){a.mode="off";return;}
    // trip toward where the record says they belong (walking OR not yet
    // departed)? keep it — they arrive on their own feet, never by teleport.
    // a stale destination re-routes on foot from wherever they are.
    if(a.trip&&a.trip.dstCode===cur)return;
    if(a.trip&&a.mode==="walk"){
      const nd=anchorOf(i,cur);
      const o2=nearestNode(a.x,a.y),dd2=nearestNode(nd[0],nd[1]);
      a.trip={dep:0,dst:nd,dstCode:cur,
        path:route(o2,dd2,R[i].n,day).map(n=>NODES[n]).concat([nd]),wp:0};
      a.nextTrip=null;return;}
    const [x,y]=anchorOf(i,cur);
    const samePlace=(cur==="."&&a.mode==="home")||(cur!=="."&&a.place===codeLoc[cur]);
    if(forceSnap||a.mode==="off"||(!samePlace&&Math.hypot(a.x-x,a.y-y)>4)){a.x=x;a.y=y;}
    a.vx=a.vy=0;a.trip=null;a.nextTrip=null;a.chat=0;a.chatWith=-1;a.partner=-1;
    a.mode=cur==="."?"home":"at";a.place=cur==="."?null:codeLoc[cur];a.qpos=-1;a.seat=-1;});
  forceSnap=false;
  const t0=s<0?382:SLOTS[s],t1=s<0?SLOTS[0]:(s<6?SLOTS[s+1]:SLOTS[6]+SLEN);
  const movers=[];
  AG.forEach((a,i)=>{
    const cur=s<0?(codeAt(i,day,0)==="~"?"~":"."):codeAt(i,day,s);
    const nxt=s<0?codeAt(i,day,0):nextCode(i,day,s);
    if(cur==="~"||nxt==="~"||nxt===cur)return;
    const dst=anchorOf(i,nxt);
    const sg=SIG[i];
    const mid=!!a.trip;                    // still finishing last journey
    const org=mid?a.trip.dst:[a.x,a.y];    // next trip starts where it ends
    const o=nearestNode(org[0],org[1]),d2=nearestNode(dst[0],dst[1]);
    const path=route(o,d2,R[i].n,day).map(n=>NODES[n]).concat([dst]);
    let plen=Math.hypot(path[0][0]-org[0],path[0][1]-org[1]);
    for(let k=1;k<path.length;k++)
      plen+=Math.hypot(path[k][0]-path[k-1][0],path[k][1]-path[k-1][1]);
    const travel=plen/sg.speed;
    const arrive=t1+(sg.punct>0.62?-3-h01(R[i].n+"er"+day+s)*8
                                  :(1-sg.punct)*24*h01(R[i].n+"lt"+day+s));
    const dep=Math.max(t0+12,arrive-travel);
    const trip={dep,dst,dstCode:nxt,path,wp:0,seed:hash(R[i].n+day+"s"+s)};
    if(mid)a.nextTrip=trip;               // installs itself on arrival
    else{a.trip=trip;movers.push(i);}
  });
  // walking together — recognition creates it, nobody is told to
  for(let x=0;x<movers.length;x++)for(let y=x+1;y<movers.length;y++){
    const i=movers[x],j=movers[y],ai=AG[i],aj=AG[j];
    if(ai.partner>=0||aj.partner>=0)continue;
    if(ai.trip.dstCode!==aj.trip.dstCode)continue;
    if(Math.hypot(ai.x-aj.x,ai.y-aj.y)>26)continue;
    const rc=recOf(R[i].n,R[j].n);
    if(rc<14)continue;
    if(h01(R[i].n+R[j].n+"pair"+day+s)>0.28+SIG[i].talk*0.35)continue;
    const lead=SIG[i].punct>=SIG[j].punct?i:j,fol=lead===i?j:i;
    AG[fol].partner=lead;AG[lead].partner=fol;
    const dep=Math.max(AG[lead].trip.dep,AG[fol].trip.dep);
    AG[lead].trip.dep=dep;
    AG[fol].trip={...AG[lead].trip,dep:dep,follow:lead};
  }
}
const covered=PIDS.filter(p=>P[p].cover&&P[p].x!=null);
function stepAgents(day,s,tod,dt){        // dt in sim-minutes (fixed 1/30)
  const wx=wxOf(day),lod=speed>=20;
  for(let i=0;i<AG.length;i++){
    const a=AG[i];if(a.mode==="off")continue;
    const sg=SIG[i];
    // departure
    if(a.trip&&(a.mode==="home"||a.mode==="at")&&tod>=a.trip.dep){
      a.mode="leaving";a.pauseT=lod?0:0.08+h01(R[i].n+"gate"+day+s)*0.1;} // the gate
    if(a.mode==="leaving"){a.pauseT-=dt;if(a.pauseT<=0)a.mode="walk";}
    if(a.mode==="chat"){
      a.chat-=dt;
      const o=AG[a.chatWith];
      if(o){a.hd+=(Math.atan2(o.y-a.y,o.x-a.x)-a.hd)*0.2;
        a.x+=Math.sin(tod*3+i)*0.004;a.y+=Math.cos(tod*2.6+i)*0.004;}
      if(a.chat<=0){a.mode=a.trip?"walk":"at";a.chatWith=-1;}
      continue;}
    if(a.mode==="walk"&&a.trip){
      // seeded micro pauses: look in a window, look around, shelter from rain
      if(!lod&&a.pauseT>0){a.pauseT-=dt;a.hd+=Math.sin(tod*7+i)*0.05;continue;}
      const t=a.trip,goal=t.follow!=null&&AG[t.follow].mode==="walk"
        ?[AG[t.follow].x+Math.cos(AG[t.follow].hd+Math.PI/2)*1.15,
          AG[t.follow].y+Math.sin(AG[t.follow].hd+Math.PI/2)*1.15]
        :(t.wp<t.path.length?t.path[t.wp]:t.dst);
      const dx=goal[0]-a.x,dy=goal[1]-a.y,dd=Math.hypot(dx,dy);
      if(t.follow==null&&dd<1.6&&t.wp<t.path.length){t.wp++;
        if(!lod&&h01(R[i].n+"ps"+day+s+t.wp)<sg.dawdle*0.33){
          a.pauseT=0.05+h01(R[i].n+"pd"+t.wp)*0.14;
          if(wx==="r"){const cv2=covered.find(p=>Math.hypot(P[p].x-a.x,P[p].y-a.y)<4);
            if(cv2)a.pauseT*=2.2;}         // a moment under the awning
        }
        continue;}
      if(dd<1.2&&(t.wp>=t.path.length||t.follow!=null&&Math.hypot(a.x-t.dst[0],a.y-t.dst[1])<2.5)){
        // arrived — and if the next journey is already queued, take a
        // breather at the door and then set off; never a teleport
        a.x=t.dst[0];a.y=t.dst[1];a.mode=t.dstCode==="."?"home":"at";
        a.place=t.dstCode==="."?null:codeLoc[t.dstCode];a.vx=a.vy=0;
        a.trip=a.nextTrip||null;a.nextTrip=null;
        if(a.trip&&a.trip.dep<tod+3)a.trip.dep=tod+3+h01(R[i].n+"bre"+day)*6;
        continue;}
      let sp=sg.speed*(wx==="r"?1.26:wx==="w"?0.92:1)*(t.follow!=null?0.97:1);
      if(t.follow!=null&&dd>3)sp*=1.25;               // catching up
      // separation + giving way
      let px=0,py=0;
      if(!lod)for(let j=0;j<AG.length;j++){if(j===i)continue;const b=AG[j];
        if(b.mode==="off")continue;
        const ex=a.x-b.x,ey=a.y-b.y,ed=ex*ex+ey*ey;
        if(ed<sg.space*sg.space&&ed>0.001){const e=Math.sqrt(ed);
          px+=ex/e*(sg.space-e)*0.5;py+=ey/e*(sg.space-e)*0.5;sp*=0.93;}}
      const ux=dx/dd,uy=dy/dd;
      const wob=lod?0:Math.sin(tod*6*sg.wob+i)*0.12;
      a.vx+=((ux*sp+px)-a.vx)*0.25;a.vy+=((uy*sp+py)-a.vy)*0.25;
      a.x+=(a.vx+(-uy)*wob*sp)*dt; a.y+=(a.vy+(ux)*wob*sp)*dt;
      a.hd+=(Math.atan2(a.vy,a.vx)-a.hd)*0.25;
      // encounters — most pass by; that is the point
      if(!lod)for(let j=i+1;j<AG.length;j++){const b=AG[j];
        if(b.mode!=="walk"||b.trip&&b.trip.follow===i||a.trip.follow===j)continue;
        const ed=Math.hypot(a.x-b.x,a.y-b.y);
        if(ed>2.1)continue;
        const key=j,ck=a.cool[key]||0;
        if(tod-ck<45)continue;
        a.cool[key]=tod;b.cool[i]=tod;
        const rc=recOf(R[i].n,R[j].n);if(rc<7)continue;
        const roll=h01(R[i].n+R[j].n+"enc"+day+Math.floor(tod));
        const warmth=(SIG[i].talk+SIG[j].talk)/2;
        if(roll<0.38)continue;                                    // pass by
        if(roll<0.66){a.hd=Math.atan2(b.y-a.y,b.x-a.x);          // a nod
          b.hd=Math.atan2(a.y-b.y,a.x-b.x);
          annFeed(day,tod,i,j,"nods to");continue;}
        if(roll<0.62+warmth*0.35){                                // stop for a word
          a.mode="chat";b.mode="chat";a.chatWith=j;b.chatWith=i;
          a.chat=b.chat=0.25+h01(R[i].n+"cl"+tod)*0.5;
          annFeed(day,tod,i,j,"stops for a word with");}
      }
      continue;}
    // at a place / home / waiting: place life handles positions
  }
  if(!lod)placeLife(day,s,tod,dt);
}
function annFeed(day,tod,i,j,verb){
  if(selRes!==i&&selRes!==j&&follow!==i&&follow!==j)return;
  const a=R[i].n,b=R[j].n,k=a+b+Math.floor(tod/20);
  if(AG[i].ann[k])return;AG[i].ann[k]=1;
  pushFeed(tod,a+" "+verb+" "+b,"enc");
}

// ---- place life: queues, clusters, seats, stands, waiting
function placeLife(day,s,tod,dt){
  const byPlace={};
  AG.forEach((a,i)=>{if(a.mode==="at"&&a.place)(byPlace[a.place]=byPlace[a.place]||[]).push(i);});
  for(const pid in byPlace){
    const list=byPlace[pid].sort((x,y)=>R[x].n<R[y].n?-1:1),pp=P[pid];
    if(pp.caps.includes("quiet")&&!pp.caps.includes("purpose"))list.sort((x,y)=>R[y].age-R[x].age);   // elders sit first
    const open=pp.open.includes(s);
    // bakery-type queue in the first minutes
    const isShop=pp.caps.includes("bread")||pp.caps.includes("errand");
    const qWindow=tod<(s<0?SLOTS[0]:SLOTS[s])+22;
    let qn=0;
    // benches: two sit, rest stand
    const bench=pp.caps.includes("quiet")&&!pp.caps.includes("purpose");
    // clusters of conversation
    const clusters=[];
    list.forEach(i=>{
      let placed=false;
      for(const c of clusters){
        if(c.length<4&&c.some(j=>recOf(R[i].n,R[j].n)>=7)&&
           h01(R[i].n+"cl"+pid+day+s)<0.85){c.push(i);placed=true;break;}}
      if(!placed)clusters.push([i]);
    });
    let ci=0;
    for(const c of clusters){
      const ang0=(hash(pid)+ci*97)%360*Math.PI/180;
      const cdist=1.6+ci*1.9;
      const seg=Math.floor(tod/15),f=(tod%15)/15,sm=f*f*(3-2*f);
      const dr=(g)=>{const hh2=hash("s"+g+"|"+pid+"g"+ci)*2654435761>>>0;
        return [Math.cos(hh2%360*Math.PI/180)*(1+hh2%20/9),
                Math.sin((hh2>>3)%360*Math.PI/180)*(1+(hh2>>2)%20/9)];};
      const d0=dr(seg),d1=dr(seg+1);
      let cx2=pp.x+Math.cos(ang0)*cdist+d0[0]+(d1[0]-d0[0])*sm,
          cy2=pp.y+Math.sin(ang0)*cdist+d0[1]+(d1[1]-d0[1])*sm;
      const speaker=Math.floor(tod*3)%c.length;
      c.forEach((i,k)=>{
        const a=AG[i];
        let tx,ty;
        if(isShop&&qWindow&&qn<6&&k===0&&c.length===1){       // the queue
          const q=qn++;tx=pp.x+1.6+q*1.05;ty=pp.y-1.7;
          a.hd+=((Math.PI)-a.hd)*0.1;
        } else if(bench&&k<2&&c.length<=2){                    // sitting
          tx=pp.x+(k?1.3:-1.3);ty=pp.y+0.5;
        } else if(pid==="field"&&R[i].child&&R[i].age>=12){    // the teens' corner
          const M2=D.micro.teens;
          const tth=(hash(R[i].n)%360)*Math.PI/180;
          tx=M2[0]+Math.cos(tth)*1.6;ty=M2[1]+Math.sin(tth)*1.2;
        } else if(pid==="ground"&&R[i].child){                 // children run
          tx=pp.x+Math.sin(tod*2.3+i)*5;ty=pp.y-3+Math.cos(tod*1.9+i)*2;
        } else if(pid==="ground"&&tod<790){                    // the railing
          const RL=D.micro.rail_turn;
          const q2=hash(R[i].n)%12;
          tx=RL[0]+(RL[2]-RL[0])*q2/12;ty=RL[1]-0.6-(k%2)*0.9;
        } else if(pid==="ground"){                             // the stand
          const row=k%3,col=Math.floor(hash(R[i].n)%9);
          tx=143+col*2.6;ty=51+row*1.5;
        } else if(pid==="busstop"){                            // lived waiting
          tx=pp.x-3+k*1.5+Math.sin(tod*1.7+i)*0.15;ty=pp.y+0.8;
        } else if(pid==="pub"&&ci>=2){                         // the leaning wall
          const WL=D.micro.pubwall;
          const q3=(hash(R[i].n+"w")%10);
          tx=WL[0]+(WL[2]-WL[0])*q3/10;ty=WL[1]+0.5;
        } else {                                               // conversation circle
          const th=ang0+(k/Math.max(c.length,2))*Math.PI*2;
          const rr=c.length>1?1.15:0.4;
          tx=cx2+Math.cos(th)*rr;ty=cy2+Math.sin(th)*rr;
          const sp2=c[speaker];
          if(c.length>1&&sp2!==i)a.hd+=(Math.atan2(AG[sp2].y-a.y,AG[sp2].x-a.x)-a.hd)*0.12;
          else a.hd+=Math.sin(tod*2+i)*0.02;
        }
        // solos take a slow turn about the place instead of standing for hours
        if(c.length===1&&!(isShop&&qWindow)&&pid!=="busstop"&&!(bench&&k<2)){
          const ws=Math.floor(tod/12),wf=(tod%12)/12,wsm=wf*wf*(3-2*wf);
          const wp=(g)=>{const hz=hash("w"+g+"|"+R[i].n+pid)*2654435761>>>0;
            const a2=(hz%3600)/3600*2*Math.PI, rr2=1.2+((hz>>8)%1000)/1000*2.6;
            return [pp.x+Math.cos(a2)*rr2,pp.y+Math.sin(a2)*rr2];};
          const w0=wp(ws),w1=wp(ws+1);
          tx=w0[0]+(w1[0]-w0[0])*wsm;ty=w0[1]+(w1[1]-w0[1])*wsm;}
        const ddx=tx-a.x,ddy=ty-a.y,ddd=Math.hypot(ddx,ddy);
        const stp=Math.min(ddd,SIG[i].speed*dt*0.7);
        if(ddd>0.03){a.x+=ddx/ddd*stp;a.y+=ddy/ddd*stp;
          if(ddd>0.7)a.hd+=(Math.atan2(ddy,ddx)-a.hd)*0.2;}
      });
      ci++;
    }
  }
}

// ================================================= time engine
let simMin=6*60+40,speed=1,paused=false;
const BASE=0.2;                 // 1×: a slot in ten minutes — walking pace
let micro=0;
const MDT=1/30;                 // behaviour thinks every two seconds
function ensureSlot(){
  const day=Math.floor(simMin/DAYMIN),tod=simMin%DAYMIN;
  let s=tod<SLOTS[0]?-1:Math.min(6,Math.floor((tod-SLOTS[0])/SLEN));
  if(tod>=SLOTS[6]+SLEN)s=6;
  const key=day*8+(s+1);
  if(key!==curSlotKey){initSlot(day,s);
    // fast-forward the local layer from slot start to now (determinism)
    let t=s<0?382:SLOTS[s];
    const step=speed>=20?MDT*8:MDT*2;
    while(t<tod-0.001){stepAgents(day,s,t,Math.min(step,tod-t));t+=step;}
  }
  return [day,s,tod];
}
function advance(dtSec){
  if(paused)return;
  let mult=speed;
  const tod=simMin%DAYMIN;
  if(tod>21.7*60||tod<6.6*60)mult=Math.max(mult,120);
  const dmin=dtSec*BASE*mult;
  let left=dmin;
  while(left>0){
    const [day,s,tod2]=ensureSlot();
    const step=Math.min(left,MDT*(speed>=20?8:1));
    stepAgents(day,s,tod2,step);
    simMin=Math.min(simMin+step,NDAYS*DAYMIN-1);
    left-=step;
    if(simMin>=NDAYS*DAYMIN-1)break;
  }
}
function jumpTo(m){forceSnap=true;simMin=Math.max(0,Math.min(m,NDAYS*DAYMIN-1));
  curSlotKey=-1;feedDay=-1;
  const d=Math.floor(simMin/DAYMIN);
  if(d!==recDay)rebuildRec(d);
  ensureSlot();}

// ================================================= feed
let feedDay=-1,feedItems=[],feedShown=0;
function countAt(pid,day,s){
  const c=String.fromCharCode(65+PIDS.indexOf(pid));let n=0;
  for(const nm in D.pos){if(D.pos[nm][day][s]===c)n++;}return n;}
function pushFeed(tod,tx,cls){
  const box=document.getElementById("feeditems");

function buildFeed(day){
  const f=[];const wx=D.wx[day];

  const w=Math.floor(day/7),fx=D.fixtures[w];

    if(fx.venue==="home"){

        "GOAL — "+D.meta.club+" score ("+g+"')","goal"]));

        fx.result==="win"?"goal":""]);
      f.push([885,"the ground empties into the streets"]);
    } else {
      f.push([1000,"word comes back from "+fx.opp+": "+
        (fx.result==="win"?"won":fx.result==="draw"?"drew":"lost")+" "+fx.gf+"–"+fx.ga]);
    }}
  const KM={argue:675,peace:620,borrow:605,bday:510,ticket:860,arrive:580,retire:1050,join:730};
  D.events.forEach(e=>{if(e.d===day)f.push([KM[e.k]||700,e.t,e.k==="argue"?"goal":""]);});
  {const today=D.recog.filter(e=>e.d===day);
   today.slice(0,3).forEach((e,i)=>f.push([498+i*7,e.a+" starts greeting "+e.b+" by name"]));
   if(today.length>3)f.push([519,today[0].a+" is starting to know faces — "
     +(today.length-3)+" more this week"]);}
  if(D.cal.holidays.includes(day))f.push([420,"public holiday — the shops stay shut"]);
  f.sort((a,b)=>a[0]-b[0]);
  return f;
}
function updateFeed(){
  const day=Math.floor(simMin/DAYMIN),tod=simMin%DAYMIN;
  if(day!==feedDay){feedDay=day;feedItems=buildFeed(day);feedShown=0;
    document.getElementById("feeditems").innerHTML=
      "<div class='it' style='color:#8a8172'>— "+dateStr(day)+" —</div>";}
  while(feedShown<feedItems.length&&feedItems[feedShown][0]<=tod){
    const [tm,tx,cls]=feedItems[feedShown++];pushFeed(tm,tx,cls);}
}

// ================================================= camera + canvas

function W2S(x,y){return [(x-cam.x)*cam.z+cv.width/2,(cam.y-y)*cam.z+cv.height/2];}
function S2W(px,py){return [(px*devicePixelRatio-cv.width/2)/cam.z+cam.x,
  cam.y-(py*devicePixelRatio-cv.height/2)/cam.z];}
let dragging=false,lastP=null;

function bodyCol(seed){                       // brick 60 / paint 25 / stone 15 (SL-6)
  const u=(seed%100)/100;
  if(u<0.38)return PAL.BRK;
  if(u<0.52)return PAL.BRK2;
  if(u<0.60)return PAL.BRK3;
  if(u<0.85)return ["#f0e6c8","#f2d9a6","#ecc39a","#e8c4b4","#c9cfae","#c3cdd6","#cfc0c6","#e0d6c2"][seed%8];
  return PAL.RND2;
}

function rrect(x,y,w,h,r){cx.beginPath();cx.roundRect(x,y,w,h,r);}
function drawHouse(p,day,tod,z){
  const[px,py]=W2S(p.x,p.y);
  const seed=hash(p.id),shop=p.kit!=="home";
  const w=(shop?6.4:5.2)*z,ht=4.0*z;
  // front garden / forecourt (SL-5: the right ground)
  cx.fillStyle=shop?PAL.CONC:"rgba(140,172,116,.9)";
  rrect(px-w/2-0.5*z,py-2.0*z-0.5*z,w+1.0*z,ht+1.8*z,z*0.4);cx.fill();
  if(!shop){cx.strokeStyle="rgba(120,104,84,.8)";cx.lineWidth=Math.max(1,z*0.16);
    cx.strokeRect(px-w/2-0.5*z,py-2.0*z-0.5*z,w+1.0*z,ht+1.8*z);} // garden wall
  // body
  cx.fillStyle=shop?PAL.RND2:bodyCol(seed);
  rrect(px-w/2,py-2.0*z,w,ht,z*0.35);cx.fill();
  // roof band + ridge (SL-2: nothing thin)
  cx.fillStyle=(seed%3)?PAL.TILG:PAL.TILB;
  cx.fillRect(px-w/2,py-2.0*z,w,1.25*z);
  cx.fillStyle="rgba(38,40,44,.25)";cx.fillRect(px-w/2,py-2.0*z+1.1*z,w,0.18*z);
  // chimney
  cx.fillStyle=PAL.BRK2;cx.fillRect(px+w*0.22,py-2.55*z,0.7*z,0.8*z);
  // windows: glow when lived-in (evening) or open (shops)
  const acc=PAL[p.acc]||PAL.OLV;
  const evening=tod>1020&&tod<1310, openShop=shop&&occNow[p.kit]>0;
  cx.fillStyle=(openShop||(!shop&&evening))?PAL.GLSI:PAL.GLS;
  if(shop){cx.fillRect(px-w*0.38,py-0.1*z,w*0.76,1.15*z);}   // shop window band
  else{cx.fillRect(px-w*0.32,py-0.4*z,0.9*z,1.1*z);
       cx.fillRect(px+w*0.32-0.9*z,py-0.4*z,0.9*z,1.1*z);}
  // door in the accent — the recognisable home
  cx.fillStyle=acc;
  cx.fillRect(px-0.42*z,py+0.6*z,0.84*z,1.35*z);
  if(shop){ // awning + fat sign board
    cx.fillStyle=acc;cx.fillRect(px-w*0.42,py-0.55*z,w*0.84,0.5*z);
    cx.fillStyle=PAL.RND;cx.fillRect(px-w*0.30,py-1.05*z,w*0.60,0.44*z);
    if(cam.z>5.4*devicePixelRatio){cx.fillStyle=PAL.INK;
      cx.font=Math.max(7,z*0.62)+"px Georgia,serif";cx.textAlign="center";
      cx.fillText(p.kit.toUpperCase(),px,py-0.68*z);}
  }
  // matchday bunting on Market Street shops
  if(shop&&isMatchHome(day)){cx.strokeStyle=PAL.GRN;
    cx.lineWidth=Math.max(1,z*0.12);cx.beginPath();
    cx.moveTo(px-w/2,py-1.5*z);
    cx.quadraticCurveTo(px,py-1.1*z,px+w/2,py-1.5*z);cx.stroke();}
}

function passFilter(i,a){

const hhColor={},resColor=[];

function drawResidents(day){
  occNow={};
  AG.forEach((a,i)=>{if(a.mode==="at"&&a.place)occNow[a.place]=(occNow[a.place]||0)+1;});
  for(let i=0;i<AG.length;i++){
    const a=AG[i];if(a.mode==="off")continue;
    const pass=passFilter(i,a);
    const[sx,sy]=W2S(a.x,a.y);
    if(sx<-30||sy<-30||sx>cv.width+30||sy>cv.height+30)continue;
    const rr=(R[i].child?0.72:1.0)*Math.max(2.4,cam.z*0.5);
    cx.globalAlpha=(pass?1:0.14)*(a.mode==="home"?0.55:1);
    cx.fillStyle=filter==="hh"?hhColor[R[i].hh]:resColor[i];
    cx.beginPath();cx.arc(sx,sy,rr,0,7);cx.fill();
    // heading notch — the body language of a circle
    if(a.mode!=="home"){cx.strokeStyle="rgba(244,241,234,.85)";
      cx.lineWidth=Math.max(1,devicePixelRatio);
      cx.beginPath();cx.moveTo(sx,sy);
      cx.lineTo(sx+Math.cos(a.hd)*rr*1.5,sy-Math.sin(a.hd)*rr*1.5);cx.stroke();}
    if(R[i].sup&&isMatchHome(day)){cx.strokeStyle="#e8e2d2";
      cx.lineWidth=1.2*devicePixelRatio;cx.beginPath();cx.arc(sx,sy,rr,0,7);cx.stroke();}
    if(selRes===i||follow===i){cx.strokeStyle="#fff";cx.lineWidth=2*devicePixelRatio;
      cx.beginPath();cx.arc(sx,sy,rr+3,0,7);cx.stroke();}

// ================================================= click + panels
cv.addEventListener("click",e=>{
  const px=e.clientX*devicePixelRatio,py=e.clientY*devicePixelRatio;
  let best=-1,bd=12*devicePixelRatio;
  for(let i=0;i<AG.length;i++){const a=AG[i];if(a.mode==="off")continue;
    const[sx,sy]=W2S(a.x,a.y);const d=Math.hypot(sx-px,sy-py);
    if(d<bd){bd=d;best=i;}}
  if(best>=0){selRes=best;selPlace=null;renderInfo();return;}
  let bp=null,bpd=16*devicePixelRatio;
  PIDS.forEach(pid=>{const pl=P[pid];if(pl.x==null||!pl.pub_)return;
    const[sx,sy]=W2S(pl.x,pl.y);const d=Math.hypot(sx-px,sy-py);
    if(d<bpd){bpd=d;bp=pid;}});
  if(bp){selPlace=bp;selRes=null;renderInfo();return;}
  selRes=null;selPlace=null;follow=-1;
  document.getElementById("info").style.display="none";
});
function locPhrase(i){
  const a=AG[i];
  switch(a.mode){
    case "off":return "not yet in town";
    case "home":return "at home";
    case "leaving":return "just stepping out";
    case "chat":return "stopped for a word with "+(a.chatWith>=0?R[a.chatWith].n:"someone");
    case "walk":{const t=a.trip;
      const dest=t?(t.dstCode==="."?"home":"the "+codeLoc[t.dstCode]):"somewhere";
      const w=t&&t.follow!=null?" with "+R[t.follow].n:"";
      return "walking to "+dest+w;}
    case "at":return "at the "+a.place;
  }
  return "about";
}
function moodOf(i,day){
  const r=R[i];
  const argued=D.events.some(e=>e.k==="argue"&&e.d>day-6&&e.d<=day&&e.t.includes(r.n));
  if(argued)return "prickly";
  const w=Math.floor(day/7),fx=D.fixtures[w];
  if(r.sup&&fx&&fx.result==="win"&&day%7>=5)return "cheerful";
  if(D.wx[day]==="r")return "a little grey";
  return "content";
}
function renderInfo(){
  const box=document.getElementById("info");box.style.display="block";
  const day=Math.floor(simMin/DAYMIN),tod=simMin%DAYMIN;
  if(recDay!==day)rebuildRec(day);
  if(selRes!=null){
    const i=selRes,r=R[i];
    const rels=Object.entries(rec[r.n]||{}).filter(([o,c])=>c>=7)
      .sort((a,b)=>b[1]-a[1]).slice(0,5).map(([o])=>o);
    const open=D.intents.filter(t=>t.n===r.n&&t.b<=day&&t.e>day&&t.st!=="forgot");
    let today="";
    for(let s=0;s<7;s++){const c=codeAt(i,day,s);
      if(SLOTS[s]>tod)break;
      if(c!=="."&&c!=="~")today+="<li>"+hm(SLOTS[s]+8+hash(r.n+s)%22)+" — the "+codeLoc[c]+"</li>";}
    let wk={m:0,a:0};
    for(let dd2=Math.max(0,day-6);dd2<=day;dd2++)for(let s=0;s<7;s++){
      const c=codeAt(i,dd2,s);if(c==="~"||c===".")continue;
      if(codeLoc[c]==="ground")wk.m=1;if(codeLoc[c]==="allotment")wk.a++;}
    box.innerHTML="<button class='close' onclick=\"this.parentElement.style.display='none'\">×</button>"
      +"<h3>"+r.n+"</h3><div class='sub'>age "+r.age+(r.child?" · at school":" · "+r.occ)+"</div>"
      +"<button id='bFollow' "+(follow===i?"class='on'":"")+">"+(follow===i?"following":"follow")+"</button>"
      +"<div class='sec'>now</div>"+locPhrase(i)
      +"<div class='sec'>mood</div>"+moodOf(i,day)
      +(open.length?"<div class='sec'>meaning to</div><ul>"+open.map(t=>"<li>"
        +t.kind+" — "+(t.note||t.tg)+"</li>").join("")+"</ul>":"")
      +"<div class='sec'>knows well</div>"+(rels.join(", ")||"nobody yet")
      +"<div class='sec'>today</div><ul>"+(today||"<li>home so far</li>")+"</ul>"
      +"<div class='sec'>this week</div><ul>"
      +(wk.m?"<li>went to the match</li>":"")
      +(wk.a?"<li>allotment ×"+wk.a+"</li>":"")
      +((!wk.m&&!wk.a)?"<li>a quiet week</li>":"")+"</ul>";
    const bf=document.getElementById("bFollow");
    if(bf)bf.onclick=()=>{follow=follow===i?-1:i;renderInfo();};
  } else if(selPlace){
    const pid=selPlace,pl=P[pid],stt=D.pstats[pid]||{};
    const s=Math.max(0,Math.min(6,Math.floor(((simMin%DAYMIN)-SLOTS[0])/SLEN)));
    const openNow=(pl.days==null||pl.days.includes(day%7))&&pl.open.includes(s)
      &&!(pl.match_only&&!isMatchHome(day));
    const there=[];
    AG.forEach((a,i)=>{if(a.mode==="at"&&a.place===pid)there.push(R[i].n);});
    box.innerHTML="<button class='close' onclick=\"this.parentElement.style.display='none'\">×</button>"
      +"<h3>the "+pid+"</h3><div class='sub'>"+(openNow?"open":"closed")+" · "
      +pl.caps.join(", ")+"</div>"
      +"<div class='sec'>right now</div>"+(there.length?there.length+" here — "
        +there.slice(0,8).join(", "):"empty")
      +(stt.tags&&stt.tags.length?"<div class='sec'>known for</div><ul>"
        +stt.tags.map(t=>"<li>"+t+"</li>").join("")+"</ul>":"")
      +"<div class='sec'>this year</div><ul><li>"+(stt.visits||0)+" visits</li>"
      +"<li>"+(stt.met||0)+" first meetings</li>"
      +(stt.args?"<li>"+stt.args+" arguments</li>":"")
      +(stt.peace?"<li>"+stt.peace+" reconciliations</li>":"")+"</ul>"
      +"<div class='sec'>regulars</div>"+((stt.regulars||[]).join(", ")||"—");
  }
}

// ================================================= controls
const $=id=>document.getElementById(id);
function setSpeed(s,btn){speed=s;paused=false;
  ["b1","b2","b5","b20","b60"].forEach(b=>$(b).classList.remove("on"));
  $("bPause").classList.remove("on");if(btn)$(btn).classList.add("on");}
$("bPause").onclick=()=>{paused=!paused;$("bPause").classList.toggle("on",paused);};
$("b1").onclick=()=>setSpeed(1,"b1");$("b2").onclick=()=>setSpeed(2,"b2");
$("b5").onclick=()=>setSpeed(5,"b5");$("b20").onclick=()=>setSpeed(20,"b20");
$("b60").onclick=()=>setSpeed(60,"b60");
$("bMorn").onclick=()=>jumpTo((Math.floor(simMin/DAYMIN)+1)*DAYMIN+7*60);
$("bSat").onclick=()=>{let d=Math.floor(simMin/DAYMIN)+1;while(d%7!==5)d++;
  jumpTo(d*DAYMIN+12.4*60);};
$("bWeek").onclick=()=>jumpTo(simMin+7*DAYMIN);
$("bBack1h").onclick=()=>jumpTo(simMin-60);
$("bYest").onclick=()=>jumpTo(simMin-DAYMIN);
$("bLastSat").onclick=()=>{let d=Math.floor(simMin/DAYMIN)-1;while(d>=0&&d%7!==5)d--;
  if(d>=0)jumpTo(d*DAYMIN+12.4*60);};
const scrub=$("scrub");scrub.max=NDAYS*DAYMIN-1;
let scrubHeld=false;
scrub.addEventListener("pointerdown",()=>scrubHeld=true);
addEventListener("pointerup",()=>scrubHeld=false);
scrub.addEventListener("input",()=>jumpTo(+scrub.value));

// ================================================= main loop
rebuildRec(0);jumpTo(simMin);
let lastT=performance.now();
function frame(t){
  const dt=Math.min(0.1,(t-lastT)/1000);lastT=t;
  advance(dt);
  const day=Math.floor(simMin/DAYMIN),tod=simMin%DAYMIN;
  if(day!==recDay)rebuildRec(day);
  if(follow>=0&&AG[follow]){cam.x+=(AG[follow].x-cam.x)*0.08;
    cam.y+=(AG[follow].y-cam.y)*0.08;}
  drawMap(day,tod);
  drawResidents(day);
  drawWash(day,tod);
  updateFeed();
  $("clockbox").textContent=dateStr(day)+"  ·  "+hm(tod)
    +(isMatchHome(day)?"  ⚽ home match":"");
  $("wxbox").textContent={r:"🌧",w:"🌬",d:"☀️"}[D.wx[day]];
  if(!scrubHeld)scrub.value=simMin;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
